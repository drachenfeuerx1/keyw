name: Convert Excel sheets to CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: openpyxl kurulumu
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl

      - name: Excel sekmelerini CSV'ye çevir
        shell: bash
        run: |
          set -e

          mkdir -p data

          XLSX_FILE=$(find . -maxdepth 1 -type f -iname "*.xlsx" | head -n 1)

          if [ -z "$XLSX_FILE" ]; then
            echo "Excel dosyasi bulunamadi."
            exit 1
          fi

          echo "Kullanilan Excel: $XLSX_FILE"

          python - "$XLSX_FILE" <<'PY'
          import sys
          import csv
          import re
          from pathlib import Path
          from openpyxl import load_workbook

          xlsx_path = Path(sys.argv[1])
          output_dir = Path("data")
          output_dir.mkdir(exist_ok=True)

          # Excel'i oku
          wb = load_workbook(
              xlsx_path,
              read_only=True,
              data_only=True
          )

          def safe_filename(name):
              name = str(name).strip()
              name = re.sub(r'[<>:"/\\|?*]', '_', name)
              name = re.sub(r'\s+', '_', name)
              name = name.strip('._')
              return name[:150] or "sheet"

          manifest = []

          for ws in wb.worksheets:
              filename = safe_filename(ws.title) + ".csv"
              output = output_dir / filename

              row_count = 0

              with output.open(
                  "w",
                  newline="",
                  encoding="utf-8-sig"
              ) as f:
                  writer = csv.writer(f)

                  for row in ws.iter_rows(values_only=True):
                      writer.writerow([
                          "" if value is None else value
                          for value in row
                      ])
                      row_count += 1

              manifest.append(
                  f"{ws.title}\t{filename}\t{row_count}"
              )

              print(
                  f"{ws.title} -> {filename} -> {row_count} satir"
              )

          Path("data/manifest.txt").write_text(
              "\n".join(manifest),
              encoding="utf-8"
          )

          print("")
          print(f"Toplam sekme: {len(wb.worksheets)}")
          PY

      - name: CSV dosyalarini GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "Yeni CSV degisikligi yok."
          else
            git commit -m "Convert keyword workbook sheets to CSV"
            git push
          fi
